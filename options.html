<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ChatGPT Shortcuts</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        margin: 0;
        padding: 16px 18px;
        min-width: 340px;
        max-width: 440px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 14px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      button {
        font: inherit;
        border-radius: 8px;
        border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
        background: color-mix(in srgb, currentColor 6%, transparent);
        color: inherit;
        padding: 5px 12px;
        cursor: pointer;
      }
      #archive-keys {
        min-width: 130px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #archive-keys[aria-pressed='true'] {
        border-color: #3b82f6;
        outline: 2px solid color-mix(in srgb, #3b82f6 35%, transparent);
      }
      #status {
        min-height: 1.4em;
        margin: 10px 0;
        color: color-mix(in srgb, currentColor 70%, transparent);
      }
      #status[data-tone='error'] {
        color: #dc2626;
      }
      #status[data-tone='ok'] {
        color: #16a34a;
      }
      #archive-reset {
        font-size: 12px;
        padding: 3px 10px;
      }
    </style>
  </head>
  <body>
    <h1>ChatGPT Shortcuts</h1>
    <div class="row">
      <span>Archive conversation</span>
      <button id="archive-keys" type="button" aria-pressed="false" title="Click, then press the new keys"></button>
    </div>
    <p id="status" role="status"></p>
    <button id="archive-reset" type="button">Reset to default</button>
    <script src="keys.js"></script>
    <script src="options.js"></script>
  </body>
</html>
